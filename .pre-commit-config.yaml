# Бэкенд: Ruff (линт + формат). Фронт: TypeScript. Общее: конфликты, YAML, пробелы, концы файлов, большие файлы, секреты.
# Vulture только в CI (полный прогон), не в pre-commit.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=600"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: frontend-tsc
        name: TypeScript check (frontend)
        entry: node scripts/check-frontend-tsc.mjs
        language: system
        files: ^frontend/
