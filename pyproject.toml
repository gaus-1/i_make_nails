[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i-make-nails-bot"
version = "0.1.0"
description = "Telegram mini-app and bot for appointment booking with a nail master."
authors = [
    { name = "Vyacheslav Savin" },
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.7.0,<4.0.0",
    "aiohttp>=3.10.0,<4.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "alembic>=1.13.0,<2.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "loguru>=0.7.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "ruff>=0.6.0,<0.7.0",
    "pre-commit>=4.0.0,<5.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "SIM",# flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E402"]  # E402: allow module docstring before imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
