# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Сборка Docker-образа, push в GHCR и attestation (provenance).
# Запуск: push в main/master или тег.
name: Build and attest

on:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

jobs:
  build:
    name: Build image and attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT
          TAGS="ghcr.io/${REPO_LOWER}:latest"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}:${GITHUB_REF#refs/tags/}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.meta.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
